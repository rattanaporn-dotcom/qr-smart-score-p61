
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>QR Smart Score ป.6/1</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #edf3ff;
      color: #24354d;
    }
    .card {
      max-width: 480px;
      margin: 15px auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 12px #dce4f0;
    }
    h1 {
      color: #2656a5;
      text-align: center;
      margin-bottom: 5px;
    }
    h3, .subtitle { text-align: center; }
    .subtitle { color: #64748b; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 5px 0;
    }
    #login { background: #1769aa; color: white; }
    #logout { background: #e6eaf0; color: #253449; }
    #authStatus { font-size: 14px; text-align: center; color: #42526b; }
    #start { background: #2858b8; color: white; }
    #stop { background: #e6eaf0; color: #253449; }
    button:disabled { opacity: .55; }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      margin-top: 12px;
    }
    .result {
      padding: 14px;
      margin-top: 12px;
      background: #f1f5fb;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    #status {
      text-align: center;
      font-weight: bold;
      color: #24549a;
    }
    .notice { color: #9a6200; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QR Smart Score</h1>
    <p class="subtitle">ชั้นประถมศึกษาปีที่ 6/1</p>
    <h3>ระบบสแกน QR Code บันทึกคะแนน</h3>

    <p id="authStatus">กำลังตรวจสอบการเข้าสู่ระบบ...</p>
    <button id="login" onclick="loginGoogle()" disabled>เข้าสู่ระบบด้วย Google</button>
    <button id="logout" onclick="logoutGoogle()" hidden>ออกจากระบบ</button>
    <p id="status">กรุณาเข้าสู่ระบบก่อนเปิดกล้อง</p>

    <button id="start" onclick="startCamera()" disabled>
      เปิดกล้องสแกน QR Code
    </button>
    <button id="stop" onclick="stopCamera()" disabled>
      ปิดกล้อง
    </button>

    <div id="reader"></div>

    <div class="result">
      <strong>รหัสนักเรียน:</strong>
      <span id="student">ยังไม่ได้สแกน</span>
      <br>
      <strong>คะแนน:</strong>
      <span id="score">ยังไม่ได้สแกน</span>
    </div>

    <p class="notice">
      โหมดทดสอบ: การเข้าสู่ระบบยังไม่ใช่การอนุญาตให้บันทึกคะแนน และยังไม่มีการบันทึกลง Google Sheets
    </p>
  </div>

<script>
  let scanner = null;
  let running = false;
  let busy = false;
  let studentCode = "";
  let lastText = "";
  let lastTime = 0;

  const firebaseConfig = {
    apiKey: "AIzaSyC-nLAnCgPjVq6pvcwttiiaAcd126jRHfo",
    authDomain: "qr-smart-score-p61.firebaseapp.com",
    projectId: "qr-smart-score-p61",
    storageBucket: "qr-smart-score-p61.firebasestorage.app",
    messagingSenderId: "592432842398",
    appId: "1:592432842398:web:5d61627351171858b65d8f",
    measurementId: "G-G8XEL3HS3E"
  };

  const loginBtn = document.getElementById("login");
  const logoutBtn = document.getElementById("logout");
  const authStatusEl = document.getElementById("authStatus");
  let auth = null;
  try {
firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    auth.onAuthStateChanged(async (user) => {
      authStatusEl.textContent = user
        ? "เข้าสู่ระบบแล้ว: " + (user.email || "บัญชี Google")
        : "ยังไม่ได้เข้าสู่ระบบ";
      loginBtn.hidden = !!user;
      logoutBtn.hidden = !user;
      loginBtn.disabled = false;
      if (!user && running) await stopCamera();
      startBtn.disabled = !user || running;
      if (!user) showStatus("กรุณาเข้าสู่ระบบก่อนเปิดกล้อง");
      else if (!running) showStatus("พร้อมเปิดกล้อง (โหมดทดสอบ)");
    });
  } catch (err) {
    authStatusEl.textContent = "โหลด Firebase ไม่สำเร็จ: " + err.message;
  }

  async function loginGoogle() {
    if (!auth) return;
    loginBtn.disabled = true;
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await auth.signInWithPopup(provider);
    } catch (err) {
      authStatusEl.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + (err.code || err.message);
      loginBtn.disabled = false;
    }
  }

  async function logoutGoogle() {
    if (!auth) return;
    if (running) await stopCamera();
    await auth.signOut();
  }

  const statusEl = document.getElementById("status");
  const studentEl = document.getElementById("student");
  const scoreEl = document.getElementById("score");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");

  function showStatus(message) {
    statusEl.textContent = message;
  }

  async function startCamera() {
    if (running) return;
    if (!auth || !auth.currentUser) {
      showStatus("กรุณาเข้าสู่ระบบก่อนเปิดกล้อง");
      return;
    }

    if (!window.Html5Qrcode) {
      showStatus("โหลดระบบสแกนไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต");
      return;
    }

    startBtn.disabled = true;
    showStatus("กำลังเปิดกล้อง...");

    try {
      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: function(w, h) {
            const size = Math.min(230, w, h);
            return { width: size, height: size };
          }
        },
        onScanSuccess,
        () => {}
      );

      running = true;
      stopBtn.disabled = false;
      showStatus("สแกน QR Code นักเรียน");
    } catch (error) {
      startBtn.disabled = !auth || !auth.currentUser;
      showStatus("เปิดกล้องไม่ได้: " + error);
    }
  }

  function onScanSuccess(decodedText) {
    if (busy) return;

    const text = decodedText.trim();
    const now = Date.now();

    if (text === lastText && now - lastTime < 2500) {
      return;
    }

    lastText = text;
    lastTime = now;

    if (!studentCode) {
      if (!/^APS-P61-\d{3}$/.test(text)) {
        showStatus("กรุณาสแกน QR Code นักเรียน ป.6/1");
        return;
      }

      const number = Number(text.slice(-3));
      if (number < 1 || number > 40) {
        showStatus("รหัสนักเรียนอยู่นอกช่วง 1–40");
        return;
      }

      studentCode = text;
      studentEl.textContent = studentCode;
      scoreEl.textContent = "รอสแกนคะแนน";
      showStatus("พบรหัสนักเรียนแล้ว กรุณาสแกนคะแนน");
      return;
    }

    const match = /^SCORE:(10|[0-9])$/.exec(text);

    if (!match) {
      showStatus("กรุณาสแกน QR Code คะแนน 0–10");
      return;
    }

    busy = true;
    const score = Number(match[1]);

    scoreEl.textContent = score + " คะแนน";
    showStatus("ทดสอบสำเร็จ! ยังไม่ได้บันทึกคะแนน");

    if (navigator.vibrate) navigator.vibrate(150);

    setTimeout(() => {
      studentCode = "";
      studentEl.textContent = "ยังไม่ได้สแกน";
      scoreEl.textContent = "ยังไม่ได้สแกน";
      lastText = "";
      lastTime = 0;
      busy = false;
      showStatus("พร้อมสแกนนักเรียนคนต่อไป");
    }, 3500);
  }

  async function stopCamera() {
    if (!scanner || !running) return;

    stopBtn.disabled = true;

    try {
      await scanner.stop();
      running = false;
      startBtn.disabled = !auth || !auth.currentUser;
      showStatus("ปิดกล้องแล้ว");
    } catch (error) {
      showStatus("ปิดกล้องไม่สำเร็จ: " + error);
      stopBtn.disabled = false;
    }
  }
</script>
</body>
</html>
